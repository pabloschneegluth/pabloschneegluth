<svg xmlns="http://www.w3.org/2000/svg" width="540" height="222" viewBox="0 0 540 222" role="img" aria-label="Most used languages">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #00bfff; }
    .name { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .pct { font-size: 13px; fill: #8b949e; font-variant-numeric: tabular-nums; }
    .item { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
  <text x="270.0" y="34" class="title" text-anchor="middle">Most Used Languages</text>
  <defs>
    <clipPath id="bar"><rect x="30" y="62" width="480" height="12" rx="6.0"/></clipPath>
    <clipPath id="reveal"><rect x="30" y="62" width="0" height="12">
      <animate attributeName="width" from="0" to="480" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
    </rect></clipPath>
  </defs>
  <rect x="30" y="62" width="480" height="12" rx="6.0" fill="#21262d"/>
  <g clip-path="url(#bar)"><g clip-path="url(#reveal)"><rect x="30.00" y="62" width="401.90" height="12" fill="#3572A5"/><rect x="431.90" y="62" width="26.81" height="12" fill="#b07219"/><rect x="458.71" y="62" width="16.94" height="12" fill="#f1e05a"/><rect x="475.65" y="62" width="11.82" height="12" fill="#F05138"/><rect x="487.47" y="62" width="7.75" height="12" fill="#3178c6"/><rect x="495.22" y="62" width="6.86" height="12" fill="#7355dd"/><rect x="502.07" y="62" width="5.87" height="12" fill="#dea584"/><rect x="507.94" y="62" width="2.06" height="12" fill="#89e051"/></g></g>
  <g class="item" style="animation-delay:0.35s"><circle cx="36.0" cy="107" r="6" fill="#3572A5" stroke="#8b949e" stroke-opacity="0.35"/><text x="52.0" y="112" class="name">Python</text><text x="250.0" y="112" class="pct" text-anchor="end">83.7%</text></g><g class="item" style="animation-delay:0.42s"><circle cx="296.0" cy="107" r="6" fill="#b07219" stroke="#8b949e" stroke-opacity="0.35"/><text x="312.0" y="112" class="name">Java</text><text x="510.0" y="112" class="pct" text-anchor="end">5.6%</text></g><g class="item" style="animation-delay:0.49s"><circle cx="36.0" cy="137" r="6" fill="#f1e05a" stroke="#8b949e" stroke-opacity="0.35"/><text x="52.0" y="142" class="name">JavaScript</text><text x="250.0" y="142" class="pct" text-anchor="end">3.5%</text></g><g class="item" style="animation-delay:0.56s"><circle cx="296.0" cy="137" r="6" fill="#F05138" stroke="#8b949e" stroke-opacity="0.35"/><text x="312.0" y="142" class="name">Swift</text><text x="510.0" y="142" class="pct" text-anchor="end">2.5%</text></g><g class="item" style="animation-delay:0.63s"><circle cx="36.0" cy="167" r="6" fill="#3178c6" stroke="#8b949e" stroke-opacity="0.35"/><text x="52.0" y="172" class="name">TypeScript</text><text x="250.0" y="172" class="pct" text-anchor="end">1.6%</text></g><g class="item" style="animation-delay:0.70s"><circle cx="296.0" cy="167" r="6" fill="#7355dd" stroke="#8b949e" stroke-opacity="0.35"/><text x="312.0" y="172" class="name">C#</text><text x="510.0" y="172" class="pct" text-anchor="end">1.4%</text></g><g class="item" style="animation-delay:0.77s"><circle cx="36.0" cy="197" r="6" fill="#dea584" stroke="#8b949e" stroke-opacity="0.35"/><text x="52.0" y="202" class="name">Rust</text><text x="250.0" y="202" class="pct" text-anchor="end">1.2%</text></g><g class="item" style="animation-delay:0.84s"><circle cx="296.0" cy="197" r="6" fill="#89e051" stroke="#8b949e" stroke-opacity="0.35"/><text x="312.0" y="202" class="name">Shell</text><text x="510.0" y="202" class="pct" text-anchor="end">0.4%</text></g>
</svg>
