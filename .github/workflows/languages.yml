name: Languages card

on:
  schedule:
    - cron: "0 3 * * *"   # una vez al día
  workflow_dispatch:       # para lanzarlo a mano

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate card
        env:
          GH_TOKEN: ${{ secrets.LANGS_TOKEN }}
        run: python3 .github/scripts/languages.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "Update languages card"
          git push
