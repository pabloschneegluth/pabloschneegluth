<svg xmlns="http://www.w3.org/2000/svg" width="540" height="222" viewBox="0 0 540 222" role="img" aria-label="Most used languages">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1e90ff; }
    .name { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .pct { font-size: 13px; fill: #59636e; font-variant-numeric: tabular-nums; }
    .item { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
  <text x="270.0" y="34" class="title" text-anchor="middle">Most Used Languages</text>
  <defs>
    <clipPath id="bar"><rect x="30" y="62" width="480" height="12" rx="6.0"/></clipPath>
    <clipPath id="reveal"><rect x="30" y="62" width="0" height="12">
      <animate attributeName="width" from="0" to="480" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
    </rect></clipPath>
  </defs>
  <rect x="30" y="62" width="480" height="12" rx="6.0" fill="#eaeef2"/>
  <g clip-path="url(#bar)"><g clip-path="url(#reveal)"><rect x="30.00" y="62" width="352.22" height="12" fill="#3572A5"/><rect x="382.22" y="62" width="31.94" height="12" fill="#3178c6"/><rect x="414.17" y="62" width="26.92" height="12" fill="#dea584"/><rect x="441.09" y="62" width="22.14" height="12" fill="#b07219"/><rect x="463.23" y="62" width="16.90" height="12" fill="#7355dd"/><rect x="480.13" y="62" width="16.03" height="12" fill="#f1e05a"/><rect x="496.16" y="62" width="10.84" height="12" fill="#F05138"/><rect x="507.00" y="62" width="3.00" height="12" fill="#89e051"/></g></g>
  <g class="item" style="animation-delay:0.35s"><circle cx="36.0" cy="107" r="6" fill="#3572A5" stroke="#59636e" stroke-opacity="0.35"/><text x="52.0" y="112" class="name">Python</text><text x="250.0" y="112" class="pct" text-anchor="end">73.4%</text></g><g class="item" style="animation-delay:0.42s"><circle cx="296.0" cy="107" r="6" fill="#3178c6" stroke="#59636e" stroke-opacity="0.35"/><text x="312.0" y="112" class="name">TypeScript</text><text x="510.0" y="112" class="pct" text-anchor="end">6.7%</text></g><g class="item" style="animation-delay:0.49s"><circle cx="36.0" cy="137" r="6" fill="#dea584" stroke="#59636e" stroke-opacity="0.35"/><text x="52.0" y="142" class="name">Rust</text><text x="250.0" y="142" class="pct" text-anchor="end">5.6%</text></g><g class="item" style="animation-delay:0.56s"><circle cx="296.0" cy="137" r="6" fill="#b07219" stroke="#59636e" stroke-opacity="0.35"/><text x="312.0" y="142" class="name">Java</text><text x="510.0" y="142" class="pct" text-anchor="end">4.6%</text></g><g class="item" style="animation-delay:0.63s"><circle cx="36.0" cy="167" r="6" fill="#7355dd" stroke="#59636e" stroke-opacity="0.35"/><text x="52.0" y="172" class="name">C#</text><text x="250.0" y="172" class="pct" text-anchor="end">3.5%</text></g><g class="item" style="animation-delay:0.70s"><circle cx="296.0" cy="167" r="6" fill="#f1e05a" stroke="#59636e" stroke-opacity="0.35"/><text x="312.0" y="172" class="name">JavaScript</text><text x="510.0" y="172" class="pct" text-anchor="end">3.3%</text></g><g class="item" style="animation-delay:0.77s"><circle cx="36.0" cy="197" r="6" fill="#F05138" stroke="#59636e" stroke-opacity="0.35"/><text x="52.0" y="202" class="name">Swift</text><text x="250.0" y="202" class="pct" text-anchor="end">2.3%</text></g><g class="item" style="animation-delay:0.84s"><circle cx="296.0" cy="197" r="6" fill="#89e051" stroke="#59636e" stroke-opacity="0.35"/><text x="312.0" y="202" class="name">Shell</text><text x="510.0" y="202" class="pct" text-anchor="end">0.6%</text></g>
